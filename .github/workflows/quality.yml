name: Calidad del prototipo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm ci
      - run: npm run check
      - run: npm run export:web
      - run: npm run export:native
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Exportar cuentas con API de prueba
        run: npm run export:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://auth-test.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      - name: Probar sesión, errores y cierre con API simulada
        run: npx playwright test tests/e2e/auth.spec.ts
        env:
          AUTH_E2E: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-verification
          path: |
            package-lock.json
            playwright-report/
            test-results/
            apps/mobile/dist/
          retention-days: 7
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: alacancha_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: alacancha_test
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Probar migración, permisos y concurrencia
        run: python3 supabase/tests/test_agenda.py
  required:
    name: Required quality checks
    if: always()
    needs: [prototype, database]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todas las comprobaciones
        env:
          PROTOTYPE_RESULT: ${{ needs.prototype.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: test "$PROTOTYPE_RESULT" = success && test "$DATABASE_RESULT" = success
